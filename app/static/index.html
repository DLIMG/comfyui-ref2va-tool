<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3 连续镜头工作台</title><link rel="stylesheet" href="/app.css"></head>
<body>
<aside id="preview-sidebar" class="preview-sidebar" aria-label="连续预览">
  <section id="continuous-preview" class="continuous-preview">
    <div class="preview-sidebar-head"><div><h2>连续预览</h2><p id="preview-status">尚无可播放片段</p></div><div class="preview-window-controls"><span id="preview-count" class="pill">0 段可用</span><button id="preview-size-toggle" type="button">放大</button><button id="preview-sidebar-toggle" type="button" aria-expanded="true">收起</button></div></div>
    <div class="preview-sidebar-content">
      <div class="preview-stage"><video id="continuous-video" aria-label="连续预览视频" controls preload="metadata"></video><div id="preview-empty" class="preview-empty">生成结果会按故事板顺序出现在这里。</div></div>
      <div id="preview-notice" class="preview-notice" role="status" aria-live="polite"></div>
      <div class="preview-controls"><button id="preview-restart">从头播放</button><button id="preview-prev">上一段</button><button id="preview-next">下一段</button></div>
    </div>
  </section>
</aside>
<main>
  <header class="app-header"><div><h1>H3 连续镜头工作台</h1><p>R2VA · FL2VA · Latent 续镜，可切换本地或云端 ComfyUI。</p></div><div class="device-panel"><label>生成设备 <select id="generation-target"><option value="local">本地 ComfyUI</option><option value="remote">云端 ComfyUI</option></select></label><label id="remote-comfy-row">云端 IP <input id="comfy-url" type="url" value="http://192.168.11.103:8188" placeholder="192.168.11.103:8188"><button id="test-comfy-connection" type="button">测试连接</button></label><div id="health" class="pill">正在连接…</div></div></header>
  <section id="storyboard-toolbar" class="toolbar">
    <input id="project-name" value="未命名项目" aria-label="项目名称">
    <button id="new-storyboard">新建故事板</button><button id="add-shot">＋ 新增片段</button><button id="toggle-select-all">全选</button><button id="duplicate-shot">复制片段</button><button id="delete-selected">删除选中</button>
    <span class="spacer"></span><button id="import-json">导入JSON</button><button id="export-json">导出JSON</button><button id="save-storyboard">保存</button>
    <button id="submit-selected" class="primary">生成选中</button><button id="submit-all">全部排队</button><input id="json-file" type="file" accept="application/json,.json" hidden>
  </section>
  <details id="advanced-settings" class="advanced-settings">
    <summary>高级参数（全局）</summary>
    <div class="advanced-settings-body">
      <label><input id="turbo-lora-enabled" type="checkbox" checked> 启用 Turbo LoRA <small>关闭后自动使用15步基础采样</small></label>
      <label><input id="sage-attention-enabled" type="checkbox" checked> 启用 SageAttention <small>可独立关闭以排查高分辨率稳定性</small></label>
      <label>采样步数 <input id="sampling-steps" type="number" min="1" max="100" step="1" value="8"> <small>默认 8 步</small></label>
      <label>分辨率 <select id="global-resolution"><option value="0.2mp">0.2 MP</option><option value="0.3mp">0.3 MP</option><option value="0.4mp" selected>0.4 MP（默认）</option><option value="0.5mp">0.5 MP</option><option value="0.6mp">0.6 MP</option><option value="0.7mp">0.7 MP</option><option value="0.8mp">0.8 MP</option><option value="0.9mp">0.9 MP</option><option value="1.0mp">1.0 MP</option></select> <small>应用到全部分镜</small></label>
      <label><input id="auto-upscale-enabled" type="checkbox"> 自动高清放大新结果到 <select id="upscale-resolution"><option value="720p" selected>720P</option><option value="1080p">1080P</option></select> <button id="upscale-all-results" type="button">一键放大全部</button> <small>按当前清晰度处理所有尚未放大的原始结果</small></label>
      <span>参数会应用到所有分镜；生成设备和云端 IP 也会随故事板 JSON 持久化保存。</span>
    </div>
  </details>
  <details id="comfy-log-panel" class="comfy-log-panel">
    <summary><span>ComfyUI 日志</span><span id="comfy-log-state" class="log-state">展开后自动刷新</span></summary>
    <div class="comfy-log-toolbar"><span id="comfy-log-source">尚未连接</span><span class="spacer"></span><label><input id="comfy-log-follow" type="checkbox" checked> 自动滚动</label><button id="comfy-log-refresh" type="button">刷新</button><button id="comfy-log-clear" type="button">清空显示</button></div>
    <div id="comfy-log-output" class="comfy-log-output" role="log" aria-live="off"><div class="log-placeholder">展开面板后显示 ComfyUI 终端日志。</div></div>
  </details>
  <section class="table-wrap"><table><thead><tr><th>选</th><th>片段号</th><th>标题</th><th>参考素材</th><th>画面</th><th>时长</th><th>种子</th><th>状态</th><th>结果</th><th>操作</th></tr></thead><tbody id="storyboard-body"></tbody></table></section>
  <div id="global-status" class="global-status" role="status" aria-live="polite">准备就绪</div>
</main>
<aside id="queue-sidebar" class="queue-sidebar" aria-label="生成队列">
  <div class="queue-sidebar-head"><div><h2>生成队列</h2><p>正在生成和等待中的分镜</p></div><div class="queue-sidebar-controls"><span id="queue-count" class="pill">0 个</span><button id="queue-toggle" type="button" aria-expanded="true" aria-controls="queue-list">收起</button></div></div>
  <div id="queue-list" class="queue-list"></div>
  <div id="queue-empty" class="queue-empty">当前没有排队任务</div>
</aside>
<dialog id="image-preview-dialog" class="image-preview-dialog" aria-label="参考图大图预览"><button id="image-preview-close" class="image-preview-close" type="button" aria-label="关闭大图预览">×</button><img id="image-preview-full" alt="参考图大图预览"></dialog>
<template id="editor-template"><div class="editor">
  <div class="editor-head"><label>片段号<input class="edit-id"></label><label>标题<input class="edit-title"></label><label>输出名<input class="edit-output"></label><label>生成模式<select class="edit-generation-mode"><option value="r2va">R2VA 多参考</option><option value="fl2va">FL2VA 首尾帧</option></select></label><label class="continuation-option"><input class="edit-continuation" type="checkbox">延续上一镜（AV Latent）</label><label class="continuation-option"><input class="edit-save-latent" type="checkbox">保存 Latent 上下文</label><label>Latent 音频<select class="edit-audio-tail"><option value="No Audio Carryover">不继承（分段参考音频推荐）</option><option value="Match Video Handover">随画面继承</option><option value="Full Previous Tail">完整尾音继承</option></select></label></div>
<div class="editor-grid"><section><div class="section-title"><div><h3>参考图 / 关键帧</h3><p class="reference-guidance"></p></div><button type="button" class="pick-images">选择图片</button></div><div class="image-drop-zone" tabindex="0" role="button" aria-label="选择或拖入参考图">把图片拖到这里，或点击“选择图片”<input class="image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></div><div id="reference-list" class="reference-list"></div><div class="section-title"><div><h3>参考视频</h3><p>R2VA支持，每段2–15秒，最多3段；提示词使用 &lt;Video N&gt;，原声使用 &lt;Audio N&gt;。</p></div><button type="button" class="pick-videos">选择视频</button></div><div class="video-drop-zone image-drop-zone" tabindex="0" role="button" aria-label="选择或拖入参考视频">把视频拖到这里，或点击“选择视频”<input class="video-input" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm" multiple hidden></div><div class="reference-video-list reference-list"></div></section><section><div class="section-title"><h3>视频提示词（自由格式 / H3 六段式）</h3><button class="pick-text">读取 TXT</button></div><textarea id="prompt" class="edit-prompt" rows="17"></textarea></section></div>
  <section class="results-section"><div class="section-title"><h3>生成结果</h3><span class="result-summary"></span></div><div class="result-list"></div></section>
  <div class="editor-foot"><label>清晰度<select class="edit-resolution"><optgroup label="按百万像素测试"><option value="0.2mp">0.2 MP（快速测试）</option><option value="0.3mp">0.3 MP</option><option value="0.4mp">0.4 MP</option><option value="0.5mp">0.5 MP</option><option value="0.6mp">0.6 MP</option><option value="0.7mp">0.7 MP</option><option value="0.8mp">0.8 MP</option><option value="0.9mp">0.9 MP</option><option value="1.0mp">1.0 MP</option></optgroup><optgroup label="原有预设"><option value="480p">480P（0.4 MP）</option><option value="720p">720P（0.9 MP）</option><option value="1080p">1080P（2.1 MP）</option></optgroup></select></label><label>画幅<select class="edit-aspect"><option value="16:9">16:9 横屏</option><option value="9:16">9:16 竖屏</option><option value="4:3">4:3 横屏</option><option value="3:4">3:4 竖屏</option><option value="1:1">1:1 方形</option></select></label><label>时长<input class="edit-duration" type="number" min="1" step="1"></label><label>种子<input class="edit-seed" type="number" step="1"></label><button class="validate-shot">验证</button><button id="submit" class="submit-shot primary">提交本片段</button><button class="cancel-shot danger" hidden>取消生成</button><button class="open-run">打开运行目录</button><button class="open-output">打开输出目录</button><span class="editor-message"></span></div>
</div></template>
<script src="/playlist.js"></script><script src="/media-player.js"></script><script src="/project-merge.js"></script><script src="/app.js"></script></body></html>
